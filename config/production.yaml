# 报告写入前校验职位链接，过滤明确下架/Not Found 的职位
link_validation:
  enabled: true
  timeout: 8

# Gmail 邮件抓取配置
gmail:
  credentials_path: config/gmail_credentials.json
  token_path: config/gmail_token.json
  fetch_days: 1
  linkedin_senders:
    - "@linkedin.com"
    - "@e.linkedin.com"
  job_keywords:
    - interview
    - offer
    - application
    - hiring
    - opportunity

# 本地/Codex 处理配置。保留 translation 节点名兼容旧代码。
translation:
  provider: codex
  model: local-rule
  api_key_env: ""
