# 定时任务配置（小时）
schedule:
  hours: [8, 12, 18]  # 早8点、中午12点、晚6点

# 本地存储配置
storage:
  vault_dir: /Users/xxm/projects/QuantEngine_markdown_file/12-找工作  # MD文件存储目录

# 调试模式（临时开启，测试完改为false）
debug:
  enabled: true  # 开启详细调试输出

# 地点过滤（阿省主投；非阿省现场/混合职位不进入IT主报告）
location_filter:
  # AB省 (Alberta) - 核心目标
  - Calgary, Alberta
  - Calgary, AB
  - Calgary
  - Edmonton, Alberta
  - Edmonton, AB
  - Edmonton
  - Alberta, Canada
  - Alberta
  - Sherwood Park
  - AB, Canada
  # 远程：只接受明确Canada Remote，且不能是外省城市列表伪装成Remote
  - Canada, Remote
  - Remote, Canada
  - Remote Canada
  - Canada Remote

